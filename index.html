<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitor de Presença - CEFET-MG</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 14px; display: flex; justify-content: center; }
    .card { background: #ffffff; max-width: 440px; width: 100%; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
    h2 { color: #0b3954; font-size: 20px; margin: 0 0 16px 0; }
    .form-group { margin-bottom: 14px; text-align: left; }
    label { font-size: 13px; font-weight: 600; color: #334155; display: block; margin-bottom: 5px; }
    input[type="password"], select { width: 100%; padding: 11px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
    input[type="password"]:focus, select:focus { border-color: #0b3954; }
    button { width: 100%; padding: 12px; background-color: #0b3954; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #072538; }
    #msgStatusPin { font-size: 13px; margin-top: 10px; font-weight: 600; display: none; }
    #blocoLeitor { display: none; margin-top: 10px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 14px; background: #000; }
    #feedback { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; display: none; }
    .sucesso { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .duplicado { background-color: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    .erro { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Validação da Monitoria</h2>

    <!-- BLOCO 1: LOGIN POR PIN -->
    <div id="blocoLogin">
      <div class="form-group">
        <label for="txtPin">PIN de Segurança do Monitor:</label>
        <input type="password" id="txtPin" placeholder="Digite o PIN" autocomplete="off">
      </div>
      <button id="btnEntrar" onclick="validarPin()">Aceder ao Leitor</button>
      <div id="msgStatusPin"></div>
    </div>

    <!-- BLOCO 2: LEITOR E SELEÇÃO DE ATIVIDADE -->
    <div id="blocoLeitor">
      <div class="form-group">
        <label for="selEvento">Evento:</label>
        <select id="selEvento" onchange="atualizarAtividades()"></select>
      </div>

      <div class="form-group">
        <label for="selAtividade">Oficina / Atividade:</label>
        <select id="selAtividade"></select>
      </div>

      <div id="reader"></div>
      <div id="feedback"></div>
    </div>
  </div>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwCuyOlGVYnMU65_qo9jjl_bxW_VAQP6WwNje8t-V3JqCr4xOq8fKt2YTI6dmcfv7sF/exec";

    var mapaAtividades = {};
    var html5QrcodeScanner = null;
    var pinSalvo = "";
    var lendoAgora = false;

    function validarPin() {
      var pin = document.getElementById("txtPin").value.trim();
      var msg = document.getElementById("msgStatusPin");
      var btn = document.getElementById("btnEntrar");

      if (!pin) {
        msg.style.display = "block";
        msg.style.color = "#dc2626";
        msg.innerText = "Por favor, digite o PIN.";
        return;
      }

      msg.style.display = "block";
      msg.style.color = "#475569";
      msg.innerText = "A verificar PIN...";
      btn.disabled = true;

      fetch(URL_APPS_SCRIPT + "?acao=obterAtividades&pin=" + encodeURIComponent(pin))
        .then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function(dados) {
          btn.disabled = false;
          if (dados && dados.status === "ok") {
            pinSalvo = pin;
            mapaAtividades = dados.dados;
            configurarSeletores();
            document.getElementById("blocoLogin").style.display = "none";
            document.getElementById("blocoLeitor").style.display = "block";
            iniciarScanner();
          } else {
            msg.style.color = "#dc2626";
            msg.innerText = "PIN incorreto. Tente novamente.";
          }
        })
        .catch(function(err) {
          btn.disabled = false;
          msg.style.color = "#dc2626";
          msg.innerText = "Erro ao contactar o servidor. Tente de novo.";
        });
    }

    function configurarSeletores() {
      var selEv = document.getElementById("selEvento");
      selEv.innerHTML = "";
      for (var ev in mapaAtividades) {
        var opt = document.createElement("option");
        opt.value = ev;
        opt.innerText = ev;
        selEv.appendChild(opt);
      }
      atualizarAtividades();
    }

    function atualizarAtividades() {
      var selEv = document.getElementById("selEvento").value;
      var selAt = document.getElementById("selAtividade");
      selAt.innerHTML = "";
      var lista = mapaAtividades[selEv] || [];
      lista.forEach(function(at) {
        var opt = document.createElement("option");
        opt.value = at;
        opt.innerText = at;
        selAt.appendChild(opt);
      });
    }

    function iniciarScanner() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).catch(function(err) {
        exibirFeedback("erro", "Erro ao aceder à câmara: " + err);
      });
    }

    function onScanSuccess(decodedText) {
      if (lendoAgora) return;
      lendoAgora = true;

      var evento = document.getElementById("selEvento").value;
      var atividade = document.getElementById("selAtividade").value;
      var nomeDiscente = decodedText.trim();

      exibirFeedback("duplicado", "A registar presença de: " + nomeDiscente + "...");

      var urlEnvio = URL_APPS_SCRIPT + 
        "?acao=gravarPresenca" +
        "&pin=" + encodeURIComponent(pinSalvo) +
        "&evento=" + encodeURIComponent(evento) +
        "&atividade=" + encodeURIComponent(atividade) +
        "&discente=" + encodeURIComponent(nomeDiscente);

      fetch(urlEnvio)
        .then(function(res) { return res.json(); })
        .then(function(res) {
          if (res.status === "sucesso") {
            exibirFeedback("sucesso", "✔ Presença registada: " + res.nome);
          } else if (res.status === "duplicado") {
            exibirFeedback("duplicado", "⚠ Já estava registado: " + res.nome);
          } else {
            exibirFeedback("erro", "Erro: " + (res.msg || "Falha no registo"));
          }
          setTimeout(function() { lendoAgora = false; }, 2500);
        })
        .catch(function(err) {
          exibirFeedback("erro", "Erro de ligação ao gravar.");
          setTimeout(function() { lendoAgora = false; }, 2500);
        });
    }

    function exibirFeedback(classe, texto) {
      var f = document.getElementById("feedback");
      f.className = classe;
      f.innerText = texto;
      f.style.display = "block";
    }
  </script>
</body>
</html>
